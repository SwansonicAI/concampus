{% extends base %}
{% block title %}Neues Passwort{% endblock %}
{% block content %}
<h1>Neues Passwort</h1>
{% if validlink %}
<form method="post" class="form">
  {% csrf_token %}
  {{ form }}
  <div class="actions"><button class="btn">Passwort setzen</button></div>
</form>
{% else %}
<p class="lead">Dieser Link gilt nicht mehr. Bitte fordern Sie einen neuen an.</p>
<p><a class="more" href="{% url 'password_reset' %}">Neuen Link anfordern</a></p>
{% endif %}
{% endblock %}
