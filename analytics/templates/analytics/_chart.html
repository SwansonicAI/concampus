{% load l10n %}
<figure class="chart{% if c.wide %} wide{% endif %}">
  <figcaption><span>{{ c.title }}</span><span class="links">{% if c.trend %}<a href="{{ c.trend }}">Verlauf</a>{% endif %}{% if c.query and c.title %}<a href="{{ c.query.url }}">Abfrage</a>{% endif %}</span></figcaption>
  {% if c.grid %}
  <div class="scroll">
    <table class="heat hours">
      <thead><tr><th></th>{% for h in c.grid.hours %}<th class="num">{{ h }}</th>{% endfor %}</tr></thead>
      <tbody>{% for day in c.grid.days %}<tr><td>{{ day.label }}</td>{% for cell in day.cells %}<td class="num{% if cell.shade > 55 %} dark{% endif %}" style="--v: {{ cell.shade|unlocalize }}%" title="{{ cell.tip }}">{{ cell.share }}</td>{% endfor %}</tr>{% endfor %}</tbody>
    </table>
  </div>
  {% elif c.lines %}
  <div class="scroll">
    <table class="heat">
      <thead><tr><th>{{ c.table.dims.0.title }}</th>{% for h in c.head %}<th class="num">{{ h }}</th>{% endfor %}<th class="num">Gesamt</th></tr></thead>
      <tbody>
        {% for line in c.lines %}
        <tr>
          <td>{% if line.drill %}<a href="{{ line.drill }}" title="Weiter aufteilen">{{ line.label }}</a>{% else %}{{ line.label }}{% endif %}</td>
          {% for cell in line.cells %}<td class="num{% if cell.shade > 55 %} dark{% endif %}" style="--v: {{ cell.shade|unlocalize }}%">{% if cell.records %}<a href="{{ cell.records }}" data-panel>{{ cell.shown }}</a>{% else %}{{ cell.shown }}{% endif %}</td>{% endfor %}
          <td class="num"><b>{{ line.total }}</b></td>
        </tr>
        {% endfor %}
      </tbody>
      <tfoot><tr class="total"><td>Gesamt</td>{% for f in c.foot %}<td class="num">{{ f }}</td>{% endfor %}<td class="num">{{ c.total }}</td></tr></tfoot>
    </table>
  </div>
  {% elif c.columns %}
  <div class="columns{% if c.dense %} dense{% endif %}{% if c.timed %} timed{% endif %}">
    <div class="scale" aria-hidden="true"><span>{{ c.peak }}</span><span>0</span></div>
    {% for b in c.bars %}
    <div class="col{% if b.now %} now{% endif %}">
      <div class="plot">
        <span class="top">{% if b.now or not c.dense %}{{ b.shown }}{% endif %}</span>
        {% if b.records %}<a class="bar" href="{{ b.records }}" data-panel data-tip="{{ b.label }}: {{ b.shown }}" style="height: {{ b.width|unlocalize }}%"></a>
        {% else %}<span class="bar" tabindex="0" data-tip="{{ b.label }}: {{ b.shown }}" style="height: {{ b.width|unlocalize }}%"></span>{% endif %}
      </div>
      <span class="tick">{% if b.drill %}<a href="{{ b.drill }}" title="{{ b.label }} aufteilen">{{ b.tick }}</a>{% else %}{{ b.tick }}{% endif %}</span>
    </div>
    {% endfor %}
  </div>
  {% elif c.bars %}
  <div class="bars">
    {% if c.bars|length > 14 %}
    {% for b in c.bars|slice:":12" %}{% include "analytics/_bar.html" %}{% endfor %}
    <details class="tail">
      <summary>{{ c.bars|length|add:"-12" }} weitere</summary>
      {% for b in c.bars|slice:"12:" %}{% include "analytics/_bar.html" %}{% endfor %}
    </details>
    {% else %}
    {% for b in c.bars %}{% include "analytics/_bar.html" %}{% endfor %}
    {% endif %}
  </div>
  {% else %}
  <p class="empty">Nichts zu zählen.</p>
  {% endif %}
</figure>
