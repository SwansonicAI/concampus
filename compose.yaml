# The server: the app behind Caddy, which fetches the HTTPS certificate for DOMAIN.
# .env next to this file holds DOMAIN, SECRET_KEY, DATABASE_URL, EMAIL_URL, DEFAULT_FROM_EMAIL and, on the demo server, DEMO=1;
# for the Hochschule's login SAML_IDP_METADATA, SAML_SP_KEY and SAML_SP_CERT; for its Moodle MOODLE_URL and MOODLE_TOKEN
# (concampus/settings.py).
services:
  app:
    build: .
    env_file: .env
    environment:
      ALLOWED_HOSTS: ${DOMAIN}
    volumes:
      - media:/app/media
    restart: unless-stopped
  prune:  # nightly: deletion periods (manage.py prune)
    build: .
    env_file: .env
    command: sh -c 'while true; do python manage.py prune; sleep 86400; done'
    volumes:
      - media:/app/media
    restart: unless-stopped
  moodlesync:  # each minute the courses changed since to Moodle, on the first run of each day all of them (manage.py moodle)
    build: .
    env_file: .env
    command: >
      sh -c 'day=; while true; do
      if [ "$$(date +%F)" != "$$day" ]; then day=$$(date +%F); python manage.py moodle; else python manage.py moodle --changed; fi;
      sleep 60; done'
    restart: unless-stopped
  proxy:
    image: caddy:2
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/concampus-home/public:/srv/site:ro  # public/ only, so .git is never served
      - caddy:/data
    restart: unless-stopped

volumes:
  media:
  caddy:
