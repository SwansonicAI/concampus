{% with here=request.resolver_match.url_name %}
<nav class="subnav">
  {% if 'ASA' in user.roles %}
  <a href="{% url 'students:list' %}" class="{% if here == 'list' or here == 'study' %}on{% endif %}">Studierende</a>
  <a href="{% url 'students:reregistration' %}" class="{% if here == 'reregistration' %}on{% endif %}">Rückmeldung</a>
  {% else %}
  <a href="{% url 'students:index' %}" class="on">Mein Studium</a>
  {% endif %}
</nav>
{% endwith %}
