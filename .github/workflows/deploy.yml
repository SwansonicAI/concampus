name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:  # tested only, Dependabot's among them

permissions:
  contents: read

env:
  SERVER: 46.224.56.49
  SERVER_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKW8bQN5tMkWkFrmRXH3lnxoEkcsjnvIt2l39n5OPFme  # so nothing else can pose as the server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # the server's database, not SQLite: it holds data to what the models say
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DEBUG: '1'  # no SECRET_KEY here (concampus/settings.py)
      DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: python manage.py test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Run deploy.sh on the server  # the key may do nothing else there
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519  # pasted into a browser, it may carry Windows line ends
          echo "$SERVER $SERVER_KEY" > ~/.ssh/known_hosts
          ssh -T deploy@$SERVER
