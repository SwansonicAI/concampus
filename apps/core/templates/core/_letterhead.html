<div class="letterhead">
  {% if institution.logo %}<img class="logo" src="{% url 'logo' %}" alt="{{ institution.name }}">{% else %}<div class="wordmark">{% for line in institution.lines %}<span>{{ line }}</span>{% endfor %}</div>{% endif %}
  {% if not plain %}<div class="muted" style="text-align: right">{{ office }}<br>{{ institution.address|linebreaksbr }}</div>{% endif %}
</div>
