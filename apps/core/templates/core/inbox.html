{% extends base %}
{% block title %}Postfach{% endblock %}
{% block content %}
<h1>Postfach</h1>
<table data-panel>
  <thead><tr><th>Eingang</th><th>Betreff</th></tr></thead>
  <tbody>
    {% for m in letters %}
    <tr>
      <td class="muted">{{ m.created|date:"j. F Y, H:i" }}</td>
      <td><a href="{{ m.get_absolute_url }}">{% if m.read %}{{ m.subject }}{% else %}<b>{{ m.subject }}</b> <span class="badge open">neu</span>{% endif %}</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="2" class="empty">Keine Nachrichten.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
