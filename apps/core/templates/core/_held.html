{% for o in offices %}
<div><a href="{% url 'office' o.pk %}">{{ o.name }}</a><br>
<small class="muted">{% if o.institutes.all or o.programs.all %}nur für {{ o.remit }}{% else %}für die ganze Hochschule{% endif %}{% if o.until %} · bis {{ o.until|date:"j.n.Y" }}{% endif %}</small></div>
{% endfor %}
