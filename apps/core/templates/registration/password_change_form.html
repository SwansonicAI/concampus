{% extends base %}
{% block title %}Passwort ändern{% endblock %}
{% block content %}

<h1>Passwort ändern</h1>
<form method="post" class="form">
  {% csrf_token %}
  {{ form }}
  <div class="actions"><button class="btn">Passwort ändern</button><a href="{% url 'password_reset' %}">Bisheriges vergessen?</a></div>
</form>
{% endblock %}
