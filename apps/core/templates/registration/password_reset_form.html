{% extends base %}
{% block title %}Passwort vergessen{% endblock %}
{% block content %}
<h1>Passwort vergessen</h1>
<p class="lead">Geben Sie die E-Mail-Adresse Ihres Kontos an. Sie erhalten einen Link, mit dem Sie ein neues Passwort setzen.</p>
<form method="post" class="form">
  {% csrf_token %}
  {{ form }}
  <div class="actions"><button class="btn">Link senden</button><a class="btn ghost" href="{% url 'login' %}">Abbrechen</a></div>
</form>
{% endblock %}
