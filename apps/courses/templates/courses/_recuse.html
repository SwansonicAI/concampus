<form method="post" id="befangen" action="{% url 'courses:recuse' course.pk %}" style="margin-top: 20px">
  {% csrf_token %}
  {% if recusable %}
  <details>
    <summary><small>Befangenheit anzeigen</small></summary>
    <p class="muted" style="margin: 8px 0 0"><small>Wer jemanden privat unterrichtet hat oder mit ihm verwandt ist, wertet diese Person nicht; das Amt bestellt einen Ersatz.</small></p>
    <div class="inline" style="margin-top: 12px">
      <label>Person<select name="participation">{% for p in recusable %}<option value="{{ p.pk }}">{{ p.study.person.name }}</option>{% endfor %}</select></label>
      <label>Grund<input name="reason" required maxlength="200" placeholder="z. B. Privatunterricht bis 2025"></label>
      <button class="btn ghost small" data-confirm="Anzeigen? Sie werten diese Person dann nicht.">Anzeigen</button>
    </div>
  </details>
  {% endif %}
</form>
