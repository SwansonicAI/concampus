{% extends base %}
{% load composed %}
{% block title %}Studienzeitbescheinigung{% endblock %}
{% block content %}
<div class="document" data-paper="studienzeiten" data-person="{{ study.person.legal_name }}" data-matrikel="{{ study.person.matriculation|default:'' }}">
  <p class="no-print actions"><a class="btn" href="{% querystring pdf=1 %}" target="_blank">PDF</a><a class="btn ghost" href="?xml">Als XHochschule-Datei</a><a class="more" href="{{ study.get_absolute_url }}">Zur Studienakte</a></p>
  {% composed 'studienzeiten' %}
</div>
{% endblock %}
