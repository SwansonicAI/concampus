{% extends base %}
{% load composed %}
{% block title %}{{ kind.name }}{% endblock %}
{% block content %}
<div class="document" data-paper="vordruck">
  <p class="no-print actions"><a class="btn" href="{% querystring pdf=1 %}" target="_blank">PDF</a><a class="more" href="{% url 'admissions:mine' %}">Zur Bewerbung</a></p>
  {% composed 'vordruck' %}
  <p class="no-print muted" style="margin-top: 32px"><small>Unterschrieben fotografieren oder einscannen und unter „Meine Bewerbung“ hochladen.</small></p>
</div>
{% endblock %}
