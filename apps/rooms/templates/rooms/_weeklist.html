<div class="weeklist" data-panel>
  {% for d, items in agenda %}
  <h3{% if d == today %} class="today"{% endif %}>{{ d|date:"l, j. F" }}</h3>
  {% for b in items %}
  <a class="booking {{ b.tone }}{% if b.clash and clashes %} clash{% endif %}{% if b.move %} move{% endif %}{% if b.trial %} trial{% endif %}" href="{% if b.course %}{{ b.course.get_absolute_url }}{% else %}{% url 'rooms:booking' b.pk %}{% endif %}"><span>{{ b.start|time:"H:i" }}–{{ b.end|time:"H:i" }}</span><b>{% firstof b.who b.label %}</b><small>{{ b.room }}{% if b.move %} · direkt vorher in {{ b.move }}{% endif %}</small></a>
  {% endfor %}
  {% empty %}<p class="empty">In dieser Woche nichts.</p>
  {% endfor %}
</div>
