# The demo's Moodle (docs/moodle.md), next to ConCampus on its server: Moodle's PHP image serving Moodle's code from
# /opt/moodle (its 4.5 branch with the theme Boost Union, as HfM's), its cron, its own Postgres. ConCampus's Caddy serves it
# at moodle.concampus.de, over ConCampus's network, which only the web server joins. .env next to this file: DB_PASSWORD.
services:
  moodle:
    image: moodlehq/moodle-php-apache:8.3
    env_file: .env
    volumes: &code
      - /opt/moodle:/var/www/html:ro
      - ./config.php:/var/www/html/config.php:ro
      - moodledata:/var/www/moodledata
    networks: [default, campus]
    restart: unless-stopped
  cron:
    image: moodlehq/moodle-php-apache:8.3
    env_file: .env
    user: www-data
    entrypoint: sh -c 'while true; do php admin/cli/cron.php > /dev/null; sleep 60; done'
    volumes: *code
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: moodle
      POSTGRES_DB: moodle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  campus:
    external: true
    name: concampus_default

volumes:
  moodledata:
  db:
